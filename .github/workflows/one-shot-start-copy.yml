name: One-shot start copy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Apply start-screen copy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten start screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''      ctx.fillText('HOLD TO ACCELERATE',W*.5,H*.40);\n      ctx.fillText('LIFT TO TIGHTEN LINE',W*.5,H*.40+23);\n      ctx.fillText('CHECKPOINTS ADD TIME',W*.5,H*.40+46);'''
          new = '''      ctx.fillText('HOLD TO ACCELERATE  •  LIFT FOR CORNERS',W*.5,H*.40);'''
          if old not in s:
              raise SystemExit('expected start-screen block not found')
          s = s.replace(old, new)
          s = s.replace("const barW=clamp(W*.46,190,330),barH=9,x=W*.5-barW/2,y=H*.58;", "const barW=clamp(W*.46,190,330),barH=9,x=W*.5-barW/2,y=H*.52;")
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-start-copy.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten start screen copy'
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiny Run</title>
<style>
  html,body{margin:0;height:100%;background:#07131d;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  let W=0,H=0,DPR=1,skyGradient=null;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=t=>t*t*(3-2*t);

  const START_HOLD=.75;
  const BRAKE_SPEED=58;
  const MAX_SPEED=250;
  const ROAD_SEG=42;
  const DRAW_DIST=1420;

  // Road/vehicle units are deliberately game-scale rather than SI. What matters
  // is the relationship: required lateral acceleration rises with speed squared.
  const ROAD_CURVE_SCALE=.00175;
  const ROAD_HALF=116;
  const CAR_HALF=12;
  const MAX_LAT_ACCEL=50;
  const HEADING_GAIN=2.8;
  const CENTER_GAIN=.85;

  let pressed=false,started=false,gameOver=false;
  let startCharging=false,startCharge=0;
  let speed=82,distance=0,score=0,best=+(localStorage.tinyRunBest||0);
  let lateral=0,headingError=0;
  let shake=0;
  let nextCheckpoint=1800;
  let roadPoints=[];

  function horizonY(){return H*.265;}

  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    skyGradient=ctx.createLinearGradient(0,0,0,horizonY()+50);
    skyGradient.addColorStop(0,'#181842');
    skyGradient.addColorStop(.55,'#b94573');
    skyGradient.addColorStop(1,'#f49b65');
  }
  addEventListener('resize',resize);

  const bends=[
    {len:520,k:0},
    {len:430,k:.55},
    {len:260,k:0},
    {len:520,k:-.78},
    {len:300,k:-.18},
    {len:390,k:.92},
    {len:280,k:0},
    {len:620,k:-.62},
    {len:250,k:.25},
    {len:470,k:.80},
    {len:340,k:0},
    {len:700,k:-.92},
    {len:310,k:.68},
    {len:480,k:0}
  ];
  const courseLen=bends.reduce((a,b)=>a+b.len,0);

  function roadCurvature(z){
    let q=((z%courseLen)+courseLen)%courseLen;
    for(let i=0;i<bends.length;i++){
      const b=bends[i];
      if(q<=b.len){
        const prev=bends[(i-1+bends.length)%bends.length].k;
        const next=bends[(i+1)%bends.length].k;
        const edge=Math.min(105,b.len*.30);
        if(q<edge)return lerp(prev,b.k,smooth(q/edge));
        if(q>b.len-edge)return lerp(b.k,next,smooth((q-(b.len-edge))/edge));
        return b.k;
      }
      q-=b.len;
    }
    return 0;
  }

  function reset(){
    pressed=false;started=false;gameOver=false;startCharging=false;startCharge=0;
    speed=82;distance=0;score=0;lateral=0;headingError=0;shake=0;
    nextCheckpoint=1800;
  }

  function launch(){
    if(gameOver)reset();
    started=true;gameOver=false;pressed=false;startCharging=false;startCharge=0;
  }

  function press(){
    if(!started||gameOver){startCharging=true;startCharge=0;pressed=false;return;}
    pressed=true;
  }

  function release(){
    if(!started||gameOver){
      if(startCharging&&startCharge>=1)launch();
      startCharging=false;startCharge=0;pressed=false;return;
    }
    pressed=false;
  }

  addEventListener('keydown',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();}
  });
  addEventListener('keyup',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();release();}
  });
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();press();});
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
  addEventListener('blur',()=>{
    if(!started||gameOver){startCharging=false;startCharge=0;}
    pressed=false;
  });

  function crash(){
    if(gameOver)return;
    gameOver=true;pressed=false;startCharging=false;startCharge=0;
    shake=10;
    best=Math.max(best,Math.floor(score));
    localStorage.tinyRunBest=best;
  }

  function update(dt){
    dt=Math.min(dt,.033);
    shake*=Math.pow(.025,dt);

    if(!started||gameOver){
      if(startCharging)startCharge=clamp(startCharge+dt/START_HOLD,0,1);
      return;
    }

    // One button, one job: brake. Releasing lets the car accelerate again.
    const targetSpeed=pressed?BRAKE_SPEED:MAX_SPEED;
    const response=pressed?4.6:1.15;
    speed+=(targetSpeed-speed)*(1-Math.exp(-response*dt));

    // Automatic steering tries to follow the road centreline. It is not magic:
    // tyre grip limits lateral acceleration, so maximum yaw rate falls as speed
    // rises. When the road asks for more yaw than the tyres can deliver, heading
    // error accumulates and the car physically runs toward the outside edge.
    const k=roadCurvature(distance);
    const forward=speed*Math.max(.72,Math.cos(headingError));
    const roadYaw=forward*k*ROAD_CURVE_SCALE;
    const desiredYaw=roadYaw-HEADING_GAIN*headingError-CENTER_GAIN*(lateral/ROAD_HALF);
    const maxYaw=MAX_LAT_ACCEL/Math.max(speed,45);
    const actualYaw=clamp(desiredYaw,-maxYaw,maxYaw);

    headingError+=(actualYaw-roadYaw)*dt;
    headingError=clamp(headingError,-.75,.75);
    lateral+=speed*Math.sin(headingError)*dt;
    distance+=forward*dt;
    score+=forward*dt*.10;

    // The failure condition is geometric: the car reaches the edge of the road.
    // There is no curvature or speed threshold hidden here.
    const edge=ROAD_HALF-CAR_HALF;
    if(Math.abs(lateral)>=edge){
      crash();
      return;
    }

    if(distance>=nextCheckpoint){
      nextCheckpoint+=1800;
      score+=500;
    }
  }

  function perspective(d){
    const near=1-clamp(d/DRAW_DIST,0,1);
    return Math.pow(near,2.12);
  }

  function buildRoadPoints(){
    roadPoints.length=0;
    const count=Math.ceil(DRAW_DIST/ROAD_SEG);
    let heading=0,offset=0;
    const hy=horizonY();
    for(let i=0;i<=count;i++){
      const d=i*ROAD_SEG;
      const p=perspective(d);
      roadPoints.push({
        d,p,
        x:W*.5+offset*p*1.15,
        y:lerp(hy,H*1.08,p),
        width:lerp(8,W*.70,p)
      });
      if(i<count){
        const mid=d+ROAD_SEG*.5;
        heading+=roadCurvature(distance+mid)*ROAD_SEG*ROAD_CURVE_SCALE;
        offset+=heading*ROAD_SEG;
      }
    }
  }

  function drawBackground(){
    const hy=horizonY();
    ctx.fillStyle=skyGradient||'#b94573';ctx.fillRect(0,0,W,hy+50);

    const sunX=W*.72,sunY=hy*.58,sunR=clamp(W*.09,34,68);
    ctx.fillStyle='#ffd77a';ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(185,69,115,.60)';
    for(let y=sunY-sunR*.1;y<sunY+sunR;y+=8)ctx.fillRect(sunX-sunR-2,y,sunR*2+4,3);

    ctx.fillStyle='#352654';ctx.beginPath();ctx.moveTo(0,hy+30);
    for(let x=0;x<=W+80;x+=80){
      const yy=hy-18-Math.sin(x*.018+1.2)*18-Math.sin(x*.041)*9;
      ctx.lineTo(x,yy);
    }
    ctx.lineTo(W,hy+45);ctx.lineTo(0,hy+45);ctx.fill();

    ctx.fillStyle='#20384a';ctx.beginPath();ctx.moveTo(0,hy+35);
    for(let x=0;x<=W+60;x+=60){
      const yy=hy+7-Math.sin(x*.025+.4)*14-Math.sin(x*.063)*6;
      ctx.lineTo(x,yy);
    }
    ctx.lineTo(W,hy+55);ctx.lineTo(0,hy+55);ctx.fill();

    ctx.fillStyle='#184c45';ctx.fillRect(0,hy+30,W,H-hy-30);
  }

  function drawRoad(){
    buildRoadPoints();
    for(let i=roadPoints.length-2;i>=0;i--){
      const a=roadPoints[i],b=roadPoints[i+1];
      const band=Math.floor((distance+a.d)/ROAD_SEG);

      ctx.fillStyle=band%2?'#22624f':'#1d5947';
      ctx.beginPath();
      ctx.moveTo(0,a.y);ctx.lineTo(a.x-a.width*.64,a.y);
      ctx.lineTo(b.x-b.width*.64,b.y);ctx.lineTo(0,b.y);ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W,a.y);ctx.lineTo(a.x+a.width*.64,a.y);
      ctx.lineTo(b.x+b.width*.64,b.y);ctx.lineTo(W,b.y);ctx.fill();

      ctx.fillStyle=band%2?'#f3e7d0':'#d85353';
      for(const side of [-1,1]){
        ctx.beginPath();
        ctx.moveTo(a.x+side*a.width*.50,a.y);
        ctx.lineTo(a.x+side*a.width*.62,a.y);
        ctx.lineTo(b.x+side*b.width*.62,b.y);
        ctx.lineTo(b.x+side*b.width*.50,b.y);
        ctx.fill();
      }

      ctx.fillStyle=band%2?'#47474e':'#414148';
      ctx.beginPath();
      ctx.moveTo(a.x-a.width*.50,a.y);ctx.lineTo(a.x+a.width*.50,a.y);
      ctx.lineTo(b.x+b.width*.50,b.y);ctx.lineTo(b.x-b.width*.50,b.y);ctx.fill();

      if((band&3)<2){
        ctx.fillStyle='rgba(255,245,205,.72)';
        const wa=a.width*.014,wb=b.width*.014;
        ctx.beginPath();
        ctx.moveTo(a.x-wa,a.y);ctx.lineTo(a.x+wa,a.y);
        ctx.lineTo(b.x+wb,b.y);ctx.lineTo(b.x-wb,b.y);ctx.fill();
      }
    }

    const spacing=168;
    const first=Math.ceil(distance/spacing)*spacing;
    for(let z=first;z<distance+DRAW_DIST;z+=spacing){
      const d=z-distance;
      const idx=clamp(Math.round(d/ROAD_SEG),0,roadPoints.length-1);
      const p=roadPoints[idx];
      const side=(Math.floor(z/spacing)&1)?-1:1;
      const h=lerp(2,42,p.p),w=lerp(1,6,p.p);
      const x=p.x+side*p.width*.72;
      ctx.fillStyle='#f3e7d0';ctx.fillRect(x-w/2,p.y-h,w,h);
      ctx.fillStyle='#d85353';ctx.fillRect(x-w/2,p.y-h,w,h*.28);
    }
  }

  function drawCar(){
    const roadHalfPx=W*.70*.50;
    const x=W*.5+(lateral/ROAD_HALF)*roadHalfPx;
    const y=H*.79;
    const s=clamp(W/520,.72,1.25);
    ctx.save();ctx.translate(x,y);
    ctx.rotate(clamp(headingError,-.28,.28));

    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath();ctx.ellipse(0,14*s,31*s,9*s,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#d83f52';
    ctx.beginPath();
    ctx.moveTo(-29*s,10*s);ctx.lineTo(-23*s,-8*s);ctx.lineTo(-13*s,-22*s);
    ctx.lineTo(13*s,-22*s);ctx.lineTo(23*s,-8*s);ctx.lineTo(29*s,10*s);
    ctx.lineTo(24*s,20*s);ctx.lineTo(-24*s,20*s);ctx.closePath();ctx.fill();

    ctx.fillStyle='#172535';
    ctx.beginPath();ctx.moveTo(-12*s,-19*s);ctx.lineTo(12*s,-19*s);ctx.lineTo(18*s,-7*s);ctx.lineTo(-18*s,-7*s);ctx.closePath();ctx.fill();

    ctx.fillStyle=pressed?'#ff594f':'#ffcc72';
    ctx.fillRect(-23*s,5*s,8*s,5*s);ctx.fillRect(15*s,5*s,8*s,5*s);
    ctx.fillStyle='#6b1527';ctx.fillRect(-18*s,14*s,36*s,4*s);
    ctx.fillStyle='#181a20';ctx.fillRect(-30*s,8*s,5*s,13*s);ctx.fillRect(25*s,8*s,5*s,13*s);
    ctx.restore();
  }

  function drawOverlay(){
    if(started&&!gameOver)return;
    ctx.fillStyle='rgba(4,8,17,.48)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';

    ctx.font=`900 ${clamp(W*.095,34,68)}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
    ctx.fillStyle='#fff';ctx.fillText('TINY RUN',W*.5,H*.30);

    ctx.font='700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.fillStyle='rgba(255,255,255,.74)';
    if(gameOver){
      ctx.fillText('OFF ROAD',W*.5,H*.40);
      ctx.fillText(`SCORE ${Math.floor(score)}   BEST ${Math.floor(best)}`,W*.5,H*.40+23);
    }else{
      ctx.fillText('ONE BUTTON. BRAKE FOR CORNERS.',W*.5,H*.40);
      ctx.fillText('RELEASE TO GO · HOLD TO BRAKE',W*.5,H*.40+23);
    }

    const barW=clamp(W*.46,190,330),barH=9,x=W*.5-barW/2,y=H*.58;
    ctx.strokeStyle='rgba(255,255,255,.48)';ctx.lineWidth=2;ctx.strokeRect(x,y,barW,barH);
    ctx.fillStyle=startCharge>=1?'#ffd77a':'rgba(255,255,255,.88)';
    ctx.fillRect(x+2,y+2,(barW-4)*startCharge,barH-4);

    ctx.font='700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.fillStyle=startCharging?'#fff':'rgba(255,255,255,.72)';
    ctx.fillText(startCharge>=1?'RELEASE':'HOLD TO START',W*.5,y+21);
    ctx.textAlign='left';
  }

  function draw(){
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    drawBackground();drawRoad();drawCar();drawOverlay();
    ctx.restore();
  }

  let last=performance.now();
  function frame(now){
    const dt=(now-last)/1000;last=now;
    update(dt);draw();requestAnimationFrame(frame);
  }

  resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>

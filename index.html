<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiny Run</title>
<style>
html,body{margin:0;height:100%;background:#07131d;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=t=>t*t*(3-2*t);

  let W=0,H=0,DPR=1,skyGradient=null;

  const START_HOLD=.75;
  const MIN_SPEED=48;
  const MAX_SPEED=305;

  // The automatic driver chooses a plausible racing line from the road geometry.
  // Throttle never changes that steering intent. Instead speed determines the
  // trajectory: the road walks outward faster under a fast car, so the same
  // steering runs wide; a slower car traces a progressively tighter line.
  const ROAD_HALF=108;
  const CAR_HALF=12;
  // The asphalt is drawn to .50 road width and the red/white kerb to .62.
  // Collision therefore happens at the outside of the kerb, not the asphalt.
  const DRIVEABLE_HALF=ROAD_HALF*(.62/.50);
  const CURVE_DRIFT_GAIN=.60;
  const STEER_FOLLOW_RATE=90;
  const LINE_STEER_GAIN=.72;
  const MAX_STEER_RATE=180;
  const STEER_RESPONSE=.045;
  const ENTRY_OUTSIDE=.20;
  const APEX_INSIDE=.38;
  const STRAIGHT_CENTER_RATE=24;

  const ROAD_CURVE_SCALE=.00155;
  const DRAW_DIST=1080;
  const ROAD_SEG=28;
  const CHECKPOINT_SPACING=1800;

  // OutRun-style game loop: reach the next checkpoint before the clock expires.
  // The cap prevents slow early sections from turning into a huge stored reserve.
  const START_TIME=13;
  const CHECKPOINT_TIME=9;
  const MAX_TIME=15;
  const OFFROAD_RECOVERY=.95;
  const OFFROAD_SPEED=72;

  let pressed=false,started=false,gameOver=false;
  let startCharging=false,startCharge=0;
  let speed=86,distance=0,score=0,best=+(localStorage.tinyRunBest||0);
  let lateral=0,steerRate=0,curveDrift=0,understeer=0,steerFraction=0;
  let shake=0,nextCheckpoint=CHECKPOINT_SPACING;
  let timeLeft=START_TIME,checkpointFlash=0,offroadCooldown=0;
  let roadPoints=[];

  function horizonY(){return H*.19;}

  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    skyGradient=ctx.createLinearGradient(0,0,0,horizonY()+76);
    skyGradient.addColorStop(0,'#17173f');
    skyGradient.addColorStop(.54,'#b64673');
    skyGradient.addColorStop(1,'#f6a06a');
  }
  addEventListener('resize',resize);

  const bends=[
    {len:620,k:0},
    {len:520,k:.30},
    {len:260,k:0},
    {len:500,k:-1.05},
    {len:240,k:0},
    {len:420,k:.72},
    {len:180,k:0},
    {len:360,k:-.90},
    {len:260,k:0},
    {len:460,k:1.45},
    {len:180,k:0},
    {len:520,k:-.58},
    {len:240,k:0},
    {len:430,k:-1.65},
    {len:180,k:0},
    {len:300,k:.70},
    {len:520,k:0}
  ];
  const courseLen=bends.reduce((a,b)=>a+b.len,0);

  function roadRawCurvature(z){
    let q=((z%courseLen)+courseLen)%courseLen;
    for(let i=0;i<bends.length;i++){
      const b=bends[i];
      if(q<=b.len){
        const prev=bends[(i-1+bends.length)%bends.length].k;
        const edge=Math.min(120,b.len*.30);
        if(q<edge)return lerp(prev,b.k,smooth(q/edge));
        return b.k;
      }
      q-=b.len;
    }
    return 0;
  }

  function roadCurvature(z){return roadRawCurvature(z)*ROAD_CURVE_SCALE;}

  // A short preview lets the automatic driver move toward the outside before
  // turn-in. Once the bend reaches the car, current curvature owns the line.
  function entryCurve(z){
    return .65*roadRawCurvature(z+55)
         + .35*roadRawCurvature(z+120);
  }

  function reset(){
    pressed=false;started=false;gameOver=false;startCharging=false;startCharge=0;
    speed=86;distance=0;score=0;lateral=0;steerRate=0;curveDrift=0;understeer=0;steerFraction=0;
    shake=0;nextCheckpoint=CHECKPOINT_SPACING;
    timeLeft=START_TIME;checkpointFlash=0;offroadCooldown=0;
  }

  function launch(){
    if(gameOver)reset();
    started=true;gameOver=false;pressed=false;startCharging=false;startCharge=0;
  }
  function press(){
    if(!started||gameOver){startCharging=true;startCharge=0;pressed=false;return;}
    pressed=true;
  }
  function release(){
    if(!started||gameOver){
      if(startCharging&&startCharge>=1)launch();
      startCharging=false;startCharge=0;pressed=false;return;
    }
    pressed=false;
  }

  addEventListener('keydown',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press();}
  });
  addEventListener('keyup',e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();release();}
  });
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();press();});
  addEventListener('pointerup',release);
  addEventListener('pointercancel',release);
  addEventListener('blur',()=>{
    if(!started||gameOver){startCharging=false;startCharge=0;}
    pressed=false;
  });

  function endRun(){
    if(gameOver)return;
    gameOver=true;pressed=false;startCharging=false;startCharge=0;
    shake=7;
    best=Math.max(best,Math.floor(score));
    localStorage.tinyRunBest=best;
  }

  function goOffRoad(){
    if(offroadCooldown>0||gameOver)return;
    const limit=DRIVEABLE_HALF-CAR_HALF-2;
    lateral=clamp(lateral,-limit,limit);
    speed=Math.min(speed,OFFROAD_SPEED);
    offroadCooldown=OFFROAD_RECOVERY;
    shake=10;
  }

  function update(dt){
    dt=Math.min(dt,.033);
    shake*=Math.pow(.018,dt);
    checkpointFlash=Math.max(0,checkpointFlash-dt*1.7);

    if(!started||gameOver){
      if(startCharging)startCharge=clamp(startCharge+dt/START_HOLD,0,1);
      return;
    }

    timeLeft=Math.max(0,timeLeft-dt);
    if(timeLeft<=0){endRun();return;}

    if(offroadCooldown>0)offroadCooldown=Math.max(0,offroadCooldown-dt);

    let accel;
    if(offroadCooldown>0)accel=-18-.00008*speed*speed;
    else if(pressed)accel=122*(1-speed/MAX_SPEED)-5-.000045*speed*speed;
    else accel=-7-.00008*speed*speed;
    speed=clamp(speed+accel*dt,MIN_SPEED,MAX_SPEED);

    const curve=roadRawCurvature(distance);
    const preview=entryCurve(distance);

    // Road-relative motion: speed is the player's steering control. The bend
    // moves underneath the car faster as speed rises; automatic steering itself
    // does not know or care whether the throttle button is currently held.
    curveDrift=-curve*speed*CURVE_DRIFT_GAIN;

    const inCorner=Math.abs(curve)>.06;
    const approaching=!inCorner&&Math.abs(preview)>.05;
    let desiredSteer;

    if(inCorner){
      // Follow the bend while aiming progressively toward the inside. Because the
      // feed-forward steering is fixed for a given road curvature, speed selects
      // the resulting line: slow = tight, medium = balanced, fast = wide.
      const strength=clamp(Math.abs(curve)/1.3,0,1);
      const target=Math.sign(curve)*ROAD_HALF*lerp(.12,APEX_INSIDE,strength);
      desiredSteer=clamp(
        curve*STEER_FOLLOW_RATE+(target-lateral)*LINE_STEER_GAIN,
        -MAX_STEER_RATE,MAX_STEER_RATE
      );
    }else if(approaching){
      // Set up a simple racing line by drifting toward the outside before the
      // bend, while applying only a little preview steering into the corner.
      const strength=clamp(Math.abs(preview)/1.3,0,1);
      const target=-Math.sign(preview)*ROAD_HALF*ENTRY_OUTSIDE*strength;
      desiredSteer=clamp(
        preview*STEER_FOLLOW_RATE*.20+(target-lateral)*LINE_STEER_GAIN,
        -MAX_STEER_RATE,MAX_STEER_RATE
      );
    }else{
      desiredSteer=clamp(-lateral*.28,-STRAIGHT_CENTER_RATE,STRAIGHT_CENTER_RATE);
    }

    // One continuous steering rack. No throttle-dependent steering mode.
    steerRate+=(desiredSteer-steerRate)*(1-Math.exp(-dt/STEER_RESPONSE));
    steerFraction=MAX_STEER_RATE>0?steerRate/MAX_STEER_RATE:0;

    const netLateralRate=curveDrift+steerRate;
    lateral+=netLateralRate*dt;
    understeer=clamp(Math.max(0,-Math.sign(curve||1)*netLateralRate)/80,0,1.5);

    distance+=speed*dt;
    score+=speed*dt*.10;

    if(Math.abs(lateral)>=DRIVEABLE_HALF-CAR_HALF)goOffRoad();

    while(distance>=nextCheckpoint){
      nextCheckpoint+=CHECKPOINT_SPACING;
      timeLeft=Math.min(MAX_TIME,timeLeft+CHECKPOINT_TIME);
      checkpointFlash=1;
      score+=500;
    }
  }

  function perspective(d){
    const near=1-clamp(d/DRAW_DIST,0,1);
    return Math.pow(near,1.88);
  }

  function buildRoadPoints(){
    roadPoints.length=0;
    const count=Math.ceil(DRAW_DIST/ROAD_SEG);
    let heading=0,offset=0;
    const hy=horizonY();
    const roadHalfPx=W*.98*.50;
    const cameraShift=-(lateral/ROAD_HALF)*roadHalfPx;

    for(let i=0;i<=count;i++){
      const d=i*ROAD_SEG;
      const p=perspective(d);
      const x=W*.5+cameraShift*p+offset*p*1.28;
      roadPoints.push({d,p,x,y:lerp(hy,H*1.16,p),width:lerp(6,W*.98,p)});
      if(i<count){
        const mid=d+ROAD_SEG*.5;
        heading+=roadCurvature(distance+mid)*ROAD_SEG;
        offset+=heading*ROAD_SEG;
      }
    }
  }

  function pointAtDistance(d){
    const f=clamp(d/ROAD_SEG,0,roadPoints.length-1);
    const i=Math.floor(f),j=Math.min(i+1,roadPoints.length-1),q=f-i;
    const a=roadPoints[i],b=roadPoints[j];
    return {x:lerp(a.x,b.x,q),y:lerp(a.y,b.y,q),width:lerp(a.width,b.width,q),p:lerp(a.p,b.p,q)};
  }

  function drawBackground(){
    const hy=horizonY();
    ctx.fillStyle=skyGradient||'#b64673';ctx.fillRect(0,0,W,hy+76);

    const sunX=W*.73,sunY=hy*.60,sunR=clamp(W*.085,32,66);
    ctx.fillStyle='#ffd87d';ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(182,70,115,.60)';
    for(let y=sunY-sunR*.10;y<sunY+sunR;y+=8)ctx.fillRect(sunX-sunR-2,y,sunR*2+4,3);

    ctx.fillStyle='#352654';ctx.beginPath();ctx.moveTo(0,hy+35);
    for(let x=0;x<=W+80;x+=80){
      const yy=hy-17-Math.sin(x*.018+1.2)*18-Math.sin(x*.041)*9;
      ctx.lineTo(x,yy);
    }
    ctx.lineTo(W,hy+55);ctx.lineTo(0,hy+55);ctx.fill();

    ctx.fillStyle='#20384a';ctx.beginPath();ctx.moveTo(0,hy+45);
    for(let x=0;x<=W+60;x+=60){
      const yy=hy+10-Math.sin(x*.025+.4)*14-Math.sin(x*.063)*6;
      ctx.lineTo(x,yy);
    }
    ctx.lineTo(W,hy+65);ctx.lineTo(0,hy+65);ctx.fill();

    ctx.fillStyle='#174c43';ctx.fillRect(0,hy+40,W,H-hy-40);
  }

  function drawCheckpointGate(z){
    const d=z-distance;
    if(d<=0||d>=DRAW_DIST)return;
    const p=pointAtDistance(d);
    const h=lerp(2,92,p.p),postW=lerp(1,8,p.p);
    const left=p.x-p.width*.57,right=p.x+p.width*.57,top=p.y-h;
    ctx.fillStyle='#eee2ca';
    ctx.fillRect(left-postW/2,top,postW,h);ctx.fillRect(right-postW/2,top,postW,h);
    const bannerH=Math.max(2,h*.22);
    ctx.fillStyle='#d84c50';ctx.fillRect(left,top,right-left,bannerH);
    ctx.fillStyle='#f5e8cc';
    const stripeW=Math.max(2,(right-left)/12);
    for(let x=left;x<right;x+=stripeW*2)ctx.fillRect(x,top,stripeW,bannerH);
    if(p.p>.18){
      const fs=clamp(5+17*p.p,7,20);
      ctx.font=`900 ${fs}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#20212a';
      ctx.fillText('CHECKPOINT',p.x,top+bannerH*.50);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';
    }
  }

  function drawRoad(){
    buildRoadPoints();
    for(let i=roadPoints.length-2;i>=0;i--){
      const a=roadPoints[i],b=roadPoints[i+1];
      const band=Math.floor((distance+a.d)/ROAD_SEG);

      ctx.fillStyle=band&1?'#236249':'#1b5842';
      ctx.beginPath();ctx.moveTo(0,a.y);ctx.lineTo(a.x-a.width*.63,a.y);ctx.lineTo(b.x-b.width*.63,b.y);ctx.lineTo(0,b.y);ctx.fill();
      ctx.beginPath();ctx.moveTo(W,a.y);ctx.lineTo(a.x+a.width*.63,a.y);ctx.lineTo(b.x+b.width*.63,b.y);ctx.lineTo(W,b.y);ctx.fill();

      ctx.fillStyle=band&1?'#f2e7cf':'#d64f50';
      for(const side of [-1,1]){
        ctx.beginPath();ctx.moveTo(a.x+side*a.width*.50,a.y);ctx.lineTo(a.x+side*a.width*.62,a.y);ctx.lineTo(b.x+side*b.width*.62,b.y);ctx.lineTo(b.x+side*b.width*.50,b.y);ctx.fill();
      }

      ctx.fillStyle=band&1?'#47474e':'#3f4047';
      ctx.beginPath();ctx.moveTo(a.x-a.width*.50,a.y);ctx.lineTo(a.x+a.width*.50,a.y);ctx.lineTo(b.x+b.width*.50,b.y);ctx.lineTo(b.x-b.width*.50,b.y);ctx.fill();
    }

    const dashPeriod=56,dashLen=25;
    let z=Math.ceil(distance/dashPeriod)*dashPeriod;
    for(;z<distance+DRAW_DIST;z+=dashPeriod){
      const a=pointAtDistance(z-distance),b=pointAtDistance(Math.min(z-distance+dashLen,DRAW_DIST));
      const wa=a.width*.011,wb=b.width*.011;
      ctx.fillStyle='rgba(255,246,208,.84)';
      ctx.beginPath();ctx.moveTo(a.x-wa,a.y);ctx.lineTo(a.x+wa,a.y);ctx.lineTo(b.x+wb,b.y);ctx.lineTo(b.x-wb,b.y);ctx.fill();
    }

    const spacing=64;
    z=Math.ceil(distance/spacing)*spacing;
    const speedFrac=clamp((speed-90)/(MAX_SPEED-90),0,1);
    for(;z<distance+DRAW_DIST;z+=spacing){
      const p=pointAtDistance(z-distance);
      const h=lerp(2,58,p.p),w=lerp(1,7,p.p);
      for(const side of [-1,1]){
        const x=p.x+side*p.width*.70;
        if(speedFrac>.18&&p.p>.35){
          ctx.strokeStyle=`rgba(238,230,208,${.10+.22*speedFrac})`;
          ctx.lineWidth=Math.max(1,w*.42);
          ctx.beginPath();ctx.moveTo(x,p.y-h*.35);ctx.lineTo(x,p.y+h*(.45+speedFrac));ctx.stroke();
        }
        ctx.fillStyle='#f1e7d0';ctx.fillRect(x-w/2,p.y-h,w,h);
        ctx.fillStyle='#d64f50';ctx.fillRect(x-w/2,p.y-h,w,h*.27);
      }
    }

    const streakSpacing=34;
    z=Math.ceil(distance/streakSpacing)*streakSpacing;
    for(;z<distance+Math.min(DRAW_DIST,520);z+=streakSpacing){
      const p=pointAtDistance(z-distance);
      if(p.p<.28)continue;
      const index=Math.floor(z/streakSpacing);
      for(const side of [-1,1]){
        const x=p.x+side*p.width*(.76+(index%3)*.055);
        const len=lerp(1,17,p.p)*(.45+1.7*speedFrac);
        ctx.strokeStyle=`rgba(126,175,118,${.18+.20*p.p})`;
        ctx.lineWidth=Math.max(1,p.p*2.2);
        ctx.beginPath();ctx.moveTo(x,p.y-len*.15);ctx.lineTo(x,p.y+len);ctx.stroke();
      }
    }

    let cp=(Math.floor(distance/CHECKPOINT_SPACING)+1)*CHECKPOINT_SPACING;
    for(;cp<distance+DRAW_DIST;cp+=CHECKPOINT_SPACING)drawCheckpointGate(cp);
  }

  function drawCar(){
    const x=W*.5;
    const y=H*.855;
    const s=clamp(W/520,.72,1.28);

    ctx.save();ctx.translate(x,y);
    ctx.rotate(clamp(steerFraction*.075,-.075,.075));

    ctx.fillStyle='rgba(0,0,0,.30)';ctx.beginPath();ctx.ellipse(0,15*s,32*s,9*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d83f52';ctx.beginPath();
    ctx.moveTo(-29*s,10*s);ctx.lineTo(-23*s,-8*s);ctx.lineTo(-13*s,-22*s);ctx.lineTo(13*s,-22*s);ctx.lineTo(23*s,-8*s);ctx.lineTo(29*s,10*s);ctx.lineTo(24*s,20*s);ctx.lineTo(-24*s,20*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#172535';ctx.beginPath();ctx.moveTo(-12*s,-19*s);ctx.lineTo(12*s,-19*s);ctx.lineTo(18*s,-7*s);ctx.lineTo(-18*s,-7*s);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffb05f';ctx.fillRect(-23*s,5*s,8*s,5*s);ctx.fillRect(15*s,5*s,8*s,5*s);
    ctx.fillStyle='#6b1527';ctx.fillRect(-18*s,14*s,36*s,4*s);
    ctx.fillStyle='#181a20';ctx.fillRect(-30*s,8*s,5*s,13*s);ctx.fillRect(25*s,8*s,5*s,13*s);

    if(understeer>.08){
      const a=.10+.25*clamp(understeer,0,1);
      ctx.strokeStyle=`rgba(22,22,25,${a})`;ctx.lineWidth=2*s;
      ctx.beginPath();ctx.moveTo(-20*s,20*s);ctx.lineTo(-20*s,28*s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(20*s,20*s);ctx.lineTo(20*s,28*s);ctx.stroke();
    }

    if(pressed&&speed>95&&offroadCooldown<=0){
      const flick=(Math.sin(performance.now()*.035)+1)*.5;
      ctx.fillStyle=`rgba(255,205,103,${.40+.35*flick})`;
      ctx.beginPath();ctx.moveTo(-15*s,20*s);ctx.lineTo(-11*s,(27+5*flick)*s);ctx.lineTo(-7*s,20*s);ctx.fill();
    }
    ctx.restore();
  }

  function drawTimer(){
    if(!started||gameOver)return;
    const frac=clamp(timeLeft/MAX_TIME,0,1);
    const barW=clamp(W*.48,190,340),barH=7;
    const x=W*.5-barW*.5,y=12;
    const urgent=timeLeft<4;
    const pulse=.72+.28*Math.sin(performance.now()*.020);

    ctx.fillStyle='rgba(3,7,14,.42)';ctx.fillRect(x-3,y-3,barW+6,barH+6);
    ctx.strokeStyle='rgba(255,255,255,.46)';ctx.lineWidth=1;ctx.strokeRect(x,y,barW,barH);
    ctx.fillStyle=urgent?`rgba(255,91,84,${pulse})`:'#ffd77a';
    ctx.fillRect(x+1,y+1,(barW-2)*frac,barH-2);

    ctx.font='800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle=urgent?`rgba(255,255,255,${pulse})`:'rgba(255,255,255,.88)';
    ctx.fillText(`TIME ${Math.ceil(timeLeft)}`,W*.5,y+12);

    if(checkpointFlash>0){
      ctx.font='900 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
      ctx.fillStyle=`rgba(255,225,125,${checkpointFlash})`;
      ctx.fillText(`CHECKPOINT  +${CHECKPOINT_TIME}`,W*.5,y+29);
    }
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
  }

  function drawOverlay(){
    if(started&&!gameOver)return;
    ctx.fillStyle='rgba(4,8,17,.48)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font=`900 ${clamp(W*.095,34,68)}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
    ctx.fillStyle='#fff';ctx.fillText('TINY RUN',W*.5,H*.30);
    ctx.font='700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.fillStyle='rgba(255,255,255,.76)';
    if(gameOver){
      ctx.fillText('TIME UP',W*.5,H*.40);
      ctx.fillText(`SCORE ${Math.floor(score)}   BEST ${Math.floor(best)}`,W*.5,H*.40+23);
    }else{
      ctx.fillText('HOLD TO ACCELERATE',W*.5,H*.40);
      ctx.fillText('LIFT TO TIGHTEN LINE',W*.5,H*.40+23);
      ctx.fillText('CHECKPOINTS ADD TIME',W*.5,H*.40+46);
    }
    const barW=clamp(W*.46,190,330),barH=9,x=W*.5-barW/2,y=H*.58;
    ctx.strokeStyle='rgba(255,255,255,.48)';ctx.lineWidth=2;ctx.strokeRect(x,y,barW,barH);
    ctx.fillStyle=startCharge>=1?'#ffd77a':'rgba(255,255,255,.88)';ctx.fillRect(x+2,y+2,(barW-4)*startCharge,barH-4);
    ctx.font='700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    ctx.fillStyle=startCharging?'#fff':'rgba(255,255,255,.72)';ctx.fillText(startCharge>=1?'RELEASE':'HOLD TO START',W*.5,y+21);
    ctx.textAlign='left';
  }

  function draw(){
    ctx.save();
    const speedShake=started&&!gameOver?clamp((speed-210)/95,0,1)*1.15:0;
    if(shake>0||speedShake>0){const s=shake+speedShake;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
    drawBackground();drawRoad();drawCar();drawTimer();drawOverlay();
    ctx.restore();
  }

  let last=performance.now();
  function frame(now){
    const dt=(now-last)/1000;last=now;
    update(dt);draw();requestAnimationFrame(frame);
  }

  resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
